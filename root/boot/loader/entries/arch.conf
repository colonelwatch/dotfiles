title Arch Linux
linux /vmlinuz-linux-zen
initrd /intel-ucode.img
initrd /initramfs-linux-zen.img
options root=/dev/nvme0n1p2 mitigations=off i915.enable_fbc=1 intel_pstate=passive rw rootfstype=ext4 pcie_aspm.policy=performance thunderbolt.host_reset=0 pci=hpbussize=1,hpmmiosize=32M,hpmmioprefsize=32G,realloc,nocrs zswap.enabled=1 zswap.max_pool_percent=40 zswap.compressor=lz4 sysctl.vm.swappiness=133 sysctl.vm.vfs_cache_pressure=50 sysctl.vm.page-cluster=0
