default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
    - id: test-submodules-are-http
      name: Test submodules are HTTP
      entry: scripts/test_submodules_are_http.sh
      language: system
      types: [gitmodules]
    - id: shellcheck
      name: Run shellcheck
      entry: shellcheck
      language: system
      types: [shell]
      exclude_types: [fish]
    - id: shellcheck-non-executable
      name: Run shellcheck (non-executable scripts)
      entry: scripts/test_shellcheck_nonexecutable.py
      language: system
      types: [non-executable, text]
