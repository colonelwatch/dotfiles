name: Test Bootstrap
on:
  push:
    branches:
      - main
      - dev
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get -y install shellcheck
      - name: Run shellcheck on identified shell files
        shell: bash
        run: |
          git_ls() { git ls-files --recurse-submodules ':!3rdparty/' "$@"; }
          git_ls '*.sh' '*.bash' '*.bats' | xargs -r -d $'\n' shellcheck
          git_ls ':(exclude,glob)**/?*.*' |
            xargs -r -d $'\n' ./scripts/test_shellcheck_nonexecutable.py
  bootstrap:
    needs: [shellcheck]
    runs-on: ubuntu-latest
    services:
      archlinux:
        image: archlinux:base
        env:
          container: docker
        volumes:
          # mask `systemd-firstboot.service` because it awaits user input on TTY
          - /dev/null:/etc/systemd/system/systemd-firstboot.service:ro
          - /etc/os-release:/run/host/os-release:ro
          # NOTE: read-only cgroup breaks systemd, but Podman doesn't use Docker
          #       security-opt for read-write private cgroup, so use host cgroup
          - /sys/fs/cgroup:/sys/fs/cgroup
        options: >-
          --label service=archlinux
          --tty
          --stop-signal=SIGRTMIN+3
          --cgroupns=host
          --cap-add=SYS_ADMIN
          --cap-drop=AUDIT_WRITE
          --cap-drop=AUDIT_CONTROL
          --cap-drop=AUDIT_READ
          --security-opt seccomp=unconfined
          --security-opt apparmor=unconfined
          --mount type=tmpfs,destination=/tmp
          --mount type=tmpfs,destination=/run
          --health-cmd "systemctl is-system-running"
          --health-interval 2s
          --health-timeout 1s
          --health-retries 1
          --health-start-period 10s
          --mount type=tmpfs,destination=/run/lock
          --entrypoint /sbin/init
    env:
      # NOTE: `act` containers make/inherit `/home/kenny/.dotfiles`, so don't
      #       use `kenny` because `act` and GitHub Actions diverge on this
      MY_USER: lenny
    defaults:
      run:
        shell: archlinux-sh {0}
    steps:
      - name: Create archlinux-sh
        shell: bash
        run: |
          cat > /usr/local/bin/archlinux-sh <<'EOF'
          #!/bin/bash
          set -e
          script="${@: -1}"  # assume script is last argument
          chmod a+r "$script"  # ensure non-root users can read it
          docker exec "$ARCHLINUX_ID" mkdir -p "$(dirname "$script")"
          docker cp "$script" "$ARCHLINUX_ID":"$script"
          docker exec -e MY_USER="$MY_USER" -e CI="$CI" "$ARCHLINUX_ID" sh "$@"
          EOF
          chmod +x /usr/local/bin/archlinux-sh
          archlinux_id=$(docker ps -q -f label=service=archlinux)
          if [ -z "$archlinux_id" ]; then
            echo "ERROR: archlinux service container not found; " \
                 "container may have exited" >&2
            exit 1
          fi
          echo "ARCHLINUX_ID=$archlinux_id" >> "$GITHUB_ENV"
      - name: Create user ${{ env.MY_USER }}
        run: useradd -m -G wheel "$MY_USER"
      - name: Give all wheel users passwordless sudo
        run: |
          mkdir -p /etc/sudoers.d
          echo "%wheel ALL=(ALL:ALL) NOPASSWD: ALL" > /etc/sudoers.d/wheel
      - name: Give all wheel users passwordless remote polkit actions
        run: |
          mkdir -p /etc/polkit-1/rules.d
          cat > /etc/polkit-1/rules.d/90-wheel.rules <<'EOF'
          polkit.addRule(function(action, subject) {
            if (subject.isInGroup("wheel")) {
              return polkit.Result.YES;
            }
            return polkit.Result.NOT_HANDLED;
          });
          EOF
      - name: Create archlinux-user-sh
        shell: bash
        run: |
          cat > /usr/local/bin/archlinux-user-sh <<'EOF'
          #!/bin/bash
          set -e
          login_sh_cmd=(
            systemd-run -G -P -p 'User="$MY_USER"' -p PAMName=login
              -p 'WorkingDirectory="~"' /bin/sh '"$0"' '"$@"'
          )
          archlinux-sh -c "${login_sh_cmd[*]}" "$@"
          EOF
          chmod +x /usr/local/bin/archlinux-user-sh
      - uses: actions/checkout@v7
        with:
          submodules: true
      - shell: bash
        run: docker cp . "$ARCHLINUX_ID":/home/"$MY_USER"/.dotfiles
      - run: |
          chown -R "$MY_USER":"$MY_USER" /home/"$MY_USER"/.dotfiles
      - name: Prepare pacman package cache directory
        shell: bash
        run: rm -rf .pacman-pkg && mkdir .pacman-pkg
      - name: Restore pacman package cache
        uses: actions/cache/restore@v6
        with:
          path: .pacman-pkg
          key: pacman-pkg-v1-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            pacman-pkg-v1-${{ github.ref_name }}-
            pacman-pkg-v1-
      - name: Move restored cache into archlinux
        shell: bash
        run: docker cp .pacman-pkg/. "$ARCHLINUX_ID":/var/cache/pacman/pkg/
      - run: pacman --noconfirm -Syu base-devel git openssh wget pacman-contrib
      - shell: archlinux-user-sh {0}
        run: cd .dotfiles && ./bootstrap
      - shell: archlinux-user-sh {0}
        run: cd .dotfiles && bats --filter-tags !integration -j $(nproc) -r .
      - name: Prune pacman cache
        run: paccache -rk1 && paccache -ruk0
      - name: Move pruned cache out of archlinux
        shell: bash
        run: |
          rm -rf .pacman-pkg && mkdir .pacman-pkg
          docker cp "$ARCHLINUX_ID":/var/cache/pacman/pkg/. .pacman-pkg/
      - name: Save pacman package cache
        uses: actions/cache/save@v6
        with:
          path: .pacman-pkg
          key: pacman-pkg-v1-${{ github.ref_name }}-${{ github.run_id }}
